# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/rajx88/hyprland-nvidia
name: hyprland-nvidia
# description will be included in the image's metadata
description: Fedora Atomic Hyprland desktop, closed nvidia driver (GTX 10-series and older).

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/ublue-os/base-nvidia
image-version: latest

modules:
  - from-file: common/common-modules.yml
  - from-file: common/ly-modules.yml
  - from-file: common/nvidia-modules.yml
  - from-file: common/hyprland-modules.yml
  - from-file: common/apps-modules.yml
  - from-file: common/gaming-modules.yml
  - from-file: common/dev-modules.yml

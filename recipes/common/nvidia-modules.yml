# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
# Nvidia layer: nvidia-specific image files (kernel args).
# Include ONLY in nvidia recipes (closed or open), not in non-nvidia ones.
# Import with: - from-file: common/nvidia-modules.yml
modules:
  - type: files
    files:
      - source: nvidia
        destination: /

  - type: dnf
    install:
      install-weak-deps: false
      packages:
        # gpu control + suspend/resume helper
        - nvidia-settings
        - nvidia-persistenced
        # VA-API hardware video decode on the nvidia gpu (laptop battery)
        - libva-nvidia-driver

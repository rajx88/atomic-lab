# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
# App layer: rpm-installed user apps from third-party repos (steam via
# negativo17, 1Password + CLI via the official 1Password repo).
# Import with: - from-file: common/apps-modules.yml
modules:
  - type: script
    scripts:
      - enable-app-repos.sh

  - type: dnf
    repos:
      copr:
        - imput/helium
    install:
      install-weak-deps: false
      packages:
        # browsers
        - firefox
        - chromium
        - brave-browser
        - helium-bin
        # password manager
        - 1password
        - 1password-cli
